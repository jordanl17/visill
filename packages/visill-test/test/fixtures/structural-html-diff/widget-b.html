<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widget B</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .widget {
        padding: 16px;
        color: #222;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="application/json" id="ROOT_DATA">
      { "title": "Widget B", "items": ["gamma"], "count": 1 }
    </script>
    <script type="module">
            const rootElement = document.getElementById('root')
        const dataElement      = document.getElementById('ROOT_DATA')
        const payload    =   JSON.parse(dataElement.textContent)
            rootElement.textContent      =     payload.title
    </script>
  </body>
</html>
